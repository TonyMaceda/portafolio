<section class="contact-section" id="contacto" aria-labelledby="contact-title">
  <div class="contact-copy">
    <p class="section-kicker">08 / CONVERSEMOS</p>
    <h2 id="contact-title">Cuéntame qué te gustaría resolver.</h2>
    <p>
      Si tienes un proyecto, una necesidad técnica o una oportunidad profesional, puedes escribirme
      directamente.
    </p>
    <p class="contact-location">Cochabamba, Bolivia · Disponible para trabajo remoto</p>
  </div>

  <div class="contact-actions">
    <a class="email-link" [href]="emailHref">
      <span class="contact-label">CORREO ELECTRÓNICO</span>
      <span class="contact-value">{{ email }}</span>
      <span class="contact-arrow" aria-hidden="true">↗</span>
    </a>
    <a
      class="linkedin-link"
      [href]="linkedInUrl"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Abrir perfil de LinkedIn en una pestaña nueva"
    >
      Ver perfil de LinkedIn <span aria-hidden="true">↗</span>
    </a>
  </div>
</section>
